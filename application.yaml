apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alpine-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vikerup/argocd 
    targetRevision: HEAD
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: alpine-demo 
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
